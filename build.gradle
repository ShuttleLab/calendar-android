// 顶层构建文件:插件版本集中在此声明,子模块只 apply 不写版本。
// 版本与 secretary-android 保持一致(那一套已在 CI 上验证过),避免踩新版本的坑。
// EN: top-level build file — plugin versions declared once here, modules only apply them.
// Versions match secretary-android, a combination already proven on CI.
plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
}
