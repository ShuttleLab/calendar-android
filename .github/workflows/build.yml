name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 让仍在 Node 20 的 action(setup-android、upload-artifact)提前切到 Node 24,
# 赶在 2026-06-16 强制迁移之前。
# EN: opt the still-Node-20 actions onto Node 24 ahead of the 2026-06-16 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一分支的新提交取消上一次构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 显式列出要装的 SDK 组件。
      #
      # 不能用这个 action 的默认值:它默认会装 `tools`,而那个包早已从 SDK 仓库下架,
      # sdkmanager 报 "Failed to find package 'tools'" 并以非零码退出 —— 首次 CI 就是这么红的,
      # 而失败信息埋在几百行 MIPS 许可协议后面,看起来像许可问题,其实不是。
      #
      # build-tools 取 35.0.0:那是 AGP 8.9.x 的默认版本(与 compileSdk 36 无关,两者不是一回事)。
      # 版本对不上时 AGP 会自己下载,但显式列出来构建更快、也更可复现。
      #
      # EN: list the SDK packages explicitly. The action's default installs `tools`, a package long
      # since removed from the SDK repository, so sdkmanager exits non-zero with "Failed to find
      # package 'tools'" — which is how the very first CI run failed, with the real error buried
      # under several hundred lines of MIPS licence text that make it look like a licensing problem.
      # build-tools 35.0.0 is AGP 8.9.x's default (unrelated to compileSdk 36 — they are different
      # things). AGP would download a missing one itself, but naming it is faster and reproducible.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # 单元测试先跑,而且**不加 continue-on-error**。
      #
      # 这个仓库没有本地编译环境,CI 是代码第一次被真正编译与运行的地方 —— 那两个测试
      # (农历对账、节假日解析)恰好覆盖了最容易错又最难肉眼发现的部分:农历只在某些年份差一天,
      # 解析失效时界面完全正常、只是什么都不标。让它们挡在打包前面,才是这条流水线的意义。
      #
      # EN: unit tests run first and are NOT allowed to fail. There is no local build environment
      # for this repo, so CI is where the code is first genuinely compiled and run — and those two
      # suites (lunar reconciliation, holiday parsing) cover exactly what is hardest to catch by eye:
      # a lunar date that is wrong by a day in some years, and a parser failure that leaves the UI
      # looking perfectly normal while marking nothing. Gating the build on them is this pipeline's
      # whole point.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # "测试通过"和"测试跑过"不是一回事。
      #
      # 测试类没被发现、资源夹具没进包、过滤条件写错 —— 这几种情况下 Gradle 照样报 BUILD
      # SUCCESSFUL,因为它确实没有失败的测试。那时 CI 是绿的,而它什么也没验证,这比红更危险:
      # 从此每一次绿都不代表任何事情。所以这里数一遍真正执行的用例数。
      #
      # EN: "the tests passed" and "the tests ran" are different claims. If the test classes are not
      # discovered, the fixture resource is missing from the test runtime, or a filter is wrong,
      # Gradle still reports BUILD SUCCESSFUL — it genuinely had no failing tests. CI is then green
      # while verifying nothing, which is worse than red: every green afterwards means nothing. So
      # the executed cases are counted.
      - name: Assert the tests actually ran
        run: |
          RESULTS=app/build/test-results/testDebugUnitTest
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RESULTS"/*.xml 2>/dev/null \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "executed test cases: $TOTAL"
          if [ "$TOTAL" -lt 10 ]; then
            echo "::error::只执行了 $TOTAL 个用例(期望 ≥ 10)—— 测试类或夹具很可能没有被发现。"
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalendarShuttle-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # 2 天。artifact 配额是**整个组织共享的 500 MB**(GitHub Free),而这个组织下有几十个
          # 仓库在共用它。超额后的表现极其隐蔽:上传步骤**完整成功**(打印 "successfully
          # finalized"、给出下载 URL、run 全绿),而那个 artifact 按接口查是 404 —— "CI 绿着但
          # 没有包"是它唯一的症状,日志里没有一行提到配额。
          # 要更早的提交就用 workflow_dispatch 重跑那个 commit,几分钟就有。
          # EN: two days. The artifact quota is 500 MB shared across the WHOLE ORGANISATION (GitHub
          # Free) and dozens of repos draw on it. Exceeding it fails invisibly: the upload step
          # SUCCEEDS COMPLETELY — "successfully finalized", a download URL, a green run — and the
          # artifact is then a 404. "CI is green but there is no APK" is the only symptom, and no
          # log line mentions the quota. For an older commit, re-run it via workflow_dispatch.
          retention-days: 2
